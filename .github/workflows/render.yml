name: Render video
 
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic (leave empty to take the next line from topics.txt)"
        required: false
        default: ""
      type:
        description: "myth or documentary"
        required: true
        default: "myth"
        type: choice
        options:
          - myth
          - documentary
      language:
        description: "Narration language (Arabic, English, French...)"
        required: true
        default: "Arabic"
  # To run automatically 3 times a week, remove the # from the next 2 lines:
  # schedule:
  #   - cron: "0 8 * * 1,3,5"
 
permissions:
  contents: write
 
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install edge-tts requests
 
      - name: Write script and render video
        id: render
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic }}
          TYPE: ${{ github.event.inputs.type }}
          LANGUAGE: ${{ github.event.inputs.language }}
        run: python render.py
 
      - name: Remove used topic from topics.txt
        if: steps.render.outputs.from_queue == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add topics.txt
          git commit -m "Use next topic" || true
          git push || true
 
      - name: Publish release
        if: steps.render.outputs.has_topic == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: video-${{ github.run_number }}
        run: |
          gh release create "$TAG" out/final.mp4 out/thumb.jpg out/script.json \
            --title "Video ${{ github.run_number }}" --notes-file out/youtube_info.txt
 
      - name: Notify Make (optional)
        if: steps.render.outputs.has_topic == 'true'
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          TAG: video-${{ github.run_number }}
        run: python render.py notify
 
