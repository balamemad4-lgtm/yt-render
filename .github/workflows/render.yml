name: Render video
 
on:
  # Automatic: one Short every day at 14:00 UTC (change the cron line to change this)
  schedule:
    - cron: "0 14 * * *"
  # Manual: Actions > Render video > Run workflow
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic (leave empty to use topics.txt, or let Gemini invent one)"
        required: false
        default: ""
      type:
        description: "myth or documentary (leave as is for automatic)"
        required: false
        default: ""
      language:
        description: "Narration language"
        required: true
        default: "English"
 
permissions:
  contents: write
 
concurrency:
  group: render-video
  cancel-in-progress: false
 
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install edge-tts requests
 
      - name: Write script and render video
        id: render
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic }}
          TYPE: ${{ github.event.inputs.type }}
          LANGUAGE: ${{ github.event.inputs.language }}
        run: python render.py
 
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: video-${{ github.run_number }}
        run: |
          gh release create "$TAG" out/final.mp4 out/script.json \
            --title "Video ${{ github.run_number }}" --notes-file out/youtube_info.txt
 
      - name: Remember used topic
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add topics.txt used_topics.txt
          git commit -m "Update topic lists" || true
          git push || true
 
      - name: Send to Make (YouTube upload)
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          TAG: video-${{ github.run_number }}
        run: python render.py notify
 
