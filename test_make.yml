name: Test Make webhook

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Send a sample payload to Make
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'PY'
          import json, os, urllib.request
          base = f"https://github.com/{os.environ['REPO']}/releases/download/video-test"
          payload = {
              "title": "Test upload (delete me)",
              "description": "Test upload from the pipeline.",
              "tags": ["test", "pipeline"],
              "tags_csv": "test,pipeline",
              "video_url": base + "/final.mp4",
              "thumb_url": base + "/thumb.jpg",
              "script_url": base + "/script.json",
          }
          req = urllib.request.Request(os.environ["MAKE_WEBHOOK_URL"], data=json.dumps(payload).encode(),
                                       headers={"Content-Type": "application/json"})
          print(urllib.request.urlopen(req).read())
          PY
